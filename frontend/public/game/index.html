<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFC Sombrio: Batalha dos Alunos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style-v2.css" />
  <link rel="stylesheet" href="style-v3.css" />
  <link rel="stylesheet" href="style-v4.css" />
  <link rel="stylesheet" href="style-v5.css" />
  <link rel="stylesheet" href="style-v6.css" />
  <link rel="stylesheet" href="style-v7.css" />
  <link rel="stylesheet" href="style-v8.css" />
  <link rel="stylesheet" href="style-v9.css" />
  <link rel="stylesheet" href="style-v9b.css" />
  <link rel="stylesheet" href="style-v10.css" />
</head>
<body>
  <div id="game-container" data-testid="game-container">

    <!-- TELA TÍTULO -->
    <section id="screen-title" class="screen active" data-testid="screen-title">
      <div class="title-frame">
        <h1 class="title-main" data-testid="game-title">IFC Sombrio</h1>
        <h2 class="title-sub">Batalha dos Alunos</h2>
        <p class="title-flavor">"Os corredores guardam segredos sombrios..."</p>
        <div class="title-buttons">
          <button class="pixel-btn" id="btn-new-game" data-testid="btn-new-game">NOVO JOGO</button>
          <button class="pixel-btn" id="btn-continue" data-testid="btn-continue">CONTINUAR</button>
        </div>
        <p class="title-version">v9.0 — Cleber Octopus Edition</p>
      </div>
    </section>

    <!-- TELA SELEÇÃO DE PERSONAGEM INICIAL -->
    <section id="screen-pick-starter" class="screen" data-testid="screen-pick-starter">
      <h2 class="screen-title">Escolha seu Aluno Inicial</h2>
      <p class="screen-sub">Quem irá enfrentar a escuridão do IFC primeiro?</p>
      <div id="starter-grid" class="starter-grid" data-testid="starter-grid"></div>
    </section>

    <!-- TELA MAPA DO CAMPUS -->
    <section id="screen-map" class="screen" data-testid="screen-map">
      <div class="map-header">
        <h2 class="screen-title">Mapa do Campus</h2>
        <div class="player-status" id="player-status" data-testid="player-status"></div>
      </div>
      <div class="map-grid" id="map-grid" data-testid="map-grid"></div>
      <div class="map-footer">
        <button class="pixel-btn small" id="btn-party" data-testid="btn-party">PARTY</button>
        <button class="pixel-btn small" id="btn-classes" data-testid="btn-classes">CLASSES</button>
        <button class="pixel-btn small" id="btn-save" data-testid="btn-save">SALVAR</button>
        <button class="pixel-btn small danger" id="btn-quit" data-testid="btn-quit">SAIR</button>
      </div>
    </section>

    <!-- TELA DE CLASSES -->
    <section id="screen-classes" class="screen" data-testid="screen-classes">
      <div class="screen-header">
        <h2 class="screen-title">Classes</h2>
        <p class="screen-sub">Veja quais classes são fortes ou fracas entre si.</p>
      </div>
      <div class="class-table-container" id="class-table-container"></div>
      <button class="pixel-btn" id="btn-back-classes" data-testid="btn-back-classes">VOLTAR</button>
    </section>

    <!-- TELA SELEÇÃO DE ALVO NA LOCAÇÃO -->
    <section id="screen-location" class="screen" data-testid="screen-location">
      <h2 class="screen-title" id="location-title"></h2>
      <p class="screen-sub" id="location-desc"></p>
      <div class="silhouette-grid" id="silhouette-grid" data-testid="silhouette-grid"></div>
      <button class="pixel-btn" id="btn-back-map" data-testid="btn-back-map">VOLTAR AO MAPA</button>
    </section>

    <!-- TELA DE BATALHA -->
    <section id="screen-battle" class="screen" data-testid="screen-battle">
      <div class="battle-scene" id="battle-scene">
        <div class="enemies-row" id="enemies-container" data-testid="enemies-container"></div>
        <div class="party-row" id="party-container" data-testid="party-container"></div>
      </div>

      <div class="battle-ui">
        <div class="battle-log" id="battle-log" data-testid="battle-log"></div>
        <div class="battle-menu" id="battle-menu" data-testid="battle-menu">
          <button class="pixel-btn menu-btn" data-action="attack" data-testid="btn-attack">AÇÃO</button>
          <button class="pixel-btn menu-btn" data-action="item" data-testid="btn-item">ITEM</button>
          <button class="pixel-btn menu-btn" data-action="swap" data-testid="btn-swap">TROCAR</button>
          <button class="pixel-btn menu-btn danger" data-action="flee" data-testid="btn-flee">FUGIR</button>
        </div>
        <div class="battle-submenu hidden" id="battle-submenu" data-testid="battle-submenu"></div>
        <div class="battle-target hidden" id="battle-target" data-testid="battle-target"></div>
      </div>
    </section>

    <!-- MODAL GENÉRICO -->
    <div id="modal" class="modal hidden" data-testid="modal">
      <div class="modal-frame">
        <h3 id="modal-title"></h3>
        <p id="modal-body"></p>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>

</body>
